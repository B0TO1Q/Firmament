name: Build plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Engine tests
        run: |
          clang++ -std=c++17 -O2 -o engine_test Tests/engine_test.cpp && ./engine_test
          clang++ -std=c++17 -O2 -o selah_test Tests/selah_test.cpp && ./selah_test
          clang++ -std=c++17 -O2 -o selah_measure Tests/selah_measure.cpp && ./selah_measure

      - name: Configure
        run: cmake -B build -G Xcode

      - name: Build (universal, Release)
        run: >
          cmake --build build --config Release --target
          Firmament_VST3 Firmament_AU Firmament_Standalone
          Selah_VST3 Selah_AU Selah_Standalone

      - name: Package
        run: |
          for P in Firmament Selah; do
            ART=build/${P}_artefacts/Release
            mkdir -p dist/$P
            cp -R "$ART/VST3/$P.vst3" "$ART/AU/$P.component" "$ART/Standalone/$P.app" dist/$P/
            cp packaging/Install.command dist/$P/
            chmod +x dist/$P/Install.command
            codesign --force --deep -s - dist/$P/$P.vst3
            codesign --force --deep -s - dist/$P/$P.component
            codesign --force --deep -s - dist/$P/$P.app
            (cd dist && ditto -c -k --keepParent $P $P-mac.zip)
          done

      - name: Validate with pluginval (VST3 and AU)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for P in Firmament Selah; do
            cp -R dist/$P/$P.component ~/Library/Audio/Plug-Ins/Components/
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for P in Firmament Selah; do
            $PV --strictness-level 8 --validate-in-process --timeout-ms 180000 --validate dist/$P/$P.vst3
            $PV --strictness-level 8 --validate-in-process --timeout-ms 180000 --validate ~/Library/Audio/Plug-Ins/Components/$P.component
          done

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-mac
          path: dist/*-mac.zip

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          files: dist/*-mac.zip

      - name: Check for a new Selah version
        id: ver
        shell: bash
        run: |
          V=$(tr -d '[:space:]' < packaging/SELAH_VERSION)
          echo "tag=selah-v$V" >> "$GITHUB_OUTPUT"
          # publish if this version has no tag yet, or the tag was just made by this same build
          # (the Mac and Windows jobs both attach their zip to one release)
          T=$(git ls-remote --tags origin "refs/tags/selah-v$V" | cut -f1)
          if [ -z "$T" ] || [ "$T" = "$GITHUB_SHA" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Selah version release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Selah ${{ steps.ver.outputs.tag }}
          body_path: packaging/SELAH_RELEASE.md
          make_latest: true
          files: dist/Selah-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build (Release)
        run: cmake --build build --config Release --target Firmament_VST3 Firmament_Standalone Selah_VST3 Selah_Standalone

      - name: Package
        shell: pwsh
        run: |
          foreach ($P in "Firmament", "Selah") {
            New-Item -ItemType Directory -Force "dist/$P" | Out-Null
            Copy-Item -Recurse "build/${P}_artefacts/Release/VST3/$P.vst3" "dist/$P/"
            Copy-Item "build/${P}_artefacts/Release/Standalone/$P.exe" "dist/$P/"
            Set-Content "dist/$P/INSTALL.txt" "Copy the $P.vst3 folder into C:\Program Files\Common Files\VST3 then rescan plugins in your DAW."
            Compress-Archive -Path "dist/$P" -DestinationPath "dist/$P-windows.zip"
          }

      - name: Validate with pluginval (VST3)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          $failed = 0
          foreach ($P in "Firmament", "Selah") {
            # pluginval.exe is a windowed app, so wait for it explicitly and read its real exit code
            $proc = Start-Process -FilePath "./pv/pluginval.exe" -Wait -PassThru -NoNewWindow -ArgumentList "--strictness-level", "8", "--validate-in-process", "--timeout-ms", "180000", "--validate", "dist/$P/$P.vst3"
            if ($proc.ExitCode -ne 0) { Write-Host "pluginval FAILED for $P (exit $($proc.ExitCode))"; $failed = 1 } else { Write-Host "pluginval passed for $P" }
          }
          if ($failed -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows
          path: dist/*-windows.zip

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          files: dist/*-windows.zip

      - name: Check for a new Selah version
        id: ver
        shell: bash
        run: |
          V=$(tr -d '[:space:]' < packaging/SELAH_VERSION)
          echo "tag=selah-v$V" >> "$GITHUB_OUTPUT"
          # publish if this version has no tag yet, or the tag was just made by this same build
          # (the Mac and Windows jobs both attach their zip to one release)
          T=$(git ls-remote --tags origin "refs/tags/selah-v$V" | cut -f1)
          if [ -z "$T" ] || [ "$T" = "$GITHUB_SHA" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Selah version release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Selah ${{ steps.ver.outputs.tag }}
          body_path: packaging/SELAH_RELEASE.md
          make_latest: true
          files: dist/Selah-windows.zip
